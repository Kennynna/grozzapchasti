services:
  postgres:
    image: postgres:18.1-bookworm
    container_name: grozzapchasti-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: zapchasti
      POSTGRES_PASSWORD: zapzhasti123
      POSTGRES_DB: grozzapchastiDB
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U zapchasti -d grozzapchasti']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
